<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Vidéo 9:16 — export réel</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141821; --line:#232a37; --txt:#e8edf6; --dim:#8b97ab;
    --accent:#7cf3c0; --accent2:#ffb86b; --danger:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
  header .sub{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 380px;gap:20px;padding:20px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  h2{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  input[type=text],textarea,select{width:100%;background:#0e1219;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:9px 10px;font:inherit;font-size:13px}
  textarea{resize:vertical;min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{background:var(--accent);color:#06120d;border:0;border-radius:8px;padding:10px 16px;font:inherit;
    font-weight:600;font-size:13px;cursor:pointer;transition:filter .15s}
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.secondary{background:#1d2431;color:var(--txt);border:1px solid var(--line)}
  button.danger{background:#2a1518;color:var(--danger);border:1px solid #4a2226}
  #status{margin-top:12px;font-size:12px;color:var(--dim);min-height:18px}
  #status.ok{color:var(--accent)} #status.err{color:var(--danger)}
  #stageWrap{display:flex;justify-content:center;background:#05070b;border:1px solid var(--line);border-radius:12px;padding:12px}
  canvas#stage{width:100%;max-width:360px;height:auto;border-radius:8px;display:block;background:#000;
    aspect-ratio:9/16;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;font-size:12px}
  .meta div{background:#0e1219;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .meta b{display:block;color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
  .hl{color:var(--accent)}
  .warn{background:#1e1608;border:1px solid #4a3410;color:#ffcc88;border-radius:8px;padding:10px 12px;font-size:12px;margin-top:12px}
  code{background:#0e1219;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Studio Vidéo 9:16</h1>
  <span class="sub">scènes → fichier vidéo, sans enregistreur d'écran</span>
</header>

<main>
  <div>
    <section>
      <h2>1 · Scènes</h2>
      <label for="scenes">Une scène par bloc — <code>Titre | Sous-titre | secondes</code></label>
      <textarea id="scenes" spellcheck="false"></textarea>
      <div class="row">
        <button id="btnRender">▶ Générer la vidéo</button>
        <button id="btnStop" class="secondary" disabled>■ Arrêter</button>
        <button id="btnDownload" class="secondary" disabled>⬇ Télécharger</button>
      </div>
      <div class="row">
        <button id="btnFrames" class="secondary">⬇ Séquence images exacte (ZIP)</button>
      </div>
      <div id="status">Prêt.</div>
    </section>

    <section style="margin-top:16px">
      <h2>2 · Style</h2>
      <div class="row" style="margin-top:0">
        <div style="flex:1;min-width:130px">
          <label for="theme">Palette</label>
          <select id="theme">
            <option value="nuit">Nuit</option>
            <option value="ardoise">Ardoise</option>
            <option value="encre">Encre</option>
            <option value="sable">Sable</option>
          </select>
        </div>
        <div style="flex:1;min-width:130px">
          <label for="fps">Images / s</label>
          <select id="fps">
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </div>
      </div>
      <label for="titreFil">Titre permanent (facultatif)</label>
      <input type="text" id="titreFil" placeholder="ex. Portefeuille — janvier">
      <div class="warn">
        Sortie : <b>WebM</b> (VP9) si le navigateur sait le faire, sinon MP4. TikTok et Instagram
        acceptent le MP4 : convertir avec le script <code>webm-vers-mp4.sh</code> fourni.
      </div>
    </section>
  </div>

  <div>
    <section>
      <h2>3 · Aperçu</h2>
      <div id="stageWrap"><canvas id="stage" width="1080" height="1920"></canvas></div>
      <div class="meta">
        <div><b>Durée</b><span id="mDur">—</span></div>
        <div><b>Images</b><span id="mFrames">—</span></div>
        <div><b>Format</b><span id="mMime">—</span></div>
        <div><b>Poids</b><span id="mSize">—</span></div>
      </div>
    </section>
  </div>
</main>

<script>
/* ------------------------------------------------------------------ *
 * Studio Vidéo 9:16 — un seul fichier, aucune dépendance externe.
 * Le rendu se fait sur un canvas 1080x1920 ; l'export passe par
 * canvas.captureStream() + MediaRecorder, donc il produit un vrai
 * fichier vidéo (pas une capture d'écran).
 * ------------------------------------------------------------------ */

const W = 1080, H = 1920;

const PALETTES = {
  nuit:    { bg0:'#0a0e18', bg1:'#161f33', ink:'#f2f6ff', dim:'#9fb0cc', accent:'#7cf3c0' },
  ardoise: { bg0:'#11161d', bg1:'#1d2733', ink:'#eef3f9', dim:'#96a5b8', accent:'#71d0ff' },
  encre:   { bg0:'#07080c', bg1:'#121318', ink:'#ffffff', dim:'#8e94a6', accent:'#ffb86b' },
  sable:   { bg0:'#1a1712', bg1:'#2a241a', ink:'#fbf3e4', dim:'#c0b39b', accent:'#ffd479' }
};

const DEFAULT_SCENES = [
  { titre:"Trois idées de vidéos courtes", sous:"en 9:16, sans logiciel de montage", secs:3 },
  { titre:"Une scène = un titre", sous:"un sous-titre court, trois secondes", secs:3 },
  { titre:"Le rendu sort en fichier", sous:"WebM ou MP4, prêt à publier", secs:3 },
  { titre:"À toi d'écrire la suite", sous:"une ligne par scène, c'est tout", secs:3 }
];

const $ = id => document.getElementById(id);
const stage = $('stage');
const ctx = stage.getContext('2d');

let scenes = DEFAULT_SCENES.slice();
let recording = false, recorder = null, chunks = [], lastBlob = null, stopFlag = false;

/* ---------- analyse de la saisie ---------- */
function parseScenes(text){
  return text.split(/\n\s*\n|\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'))
    .map(l => {
      const p = l.split('|').map(s => s.trim());
      const secs = Math.max(0.5, Math.min(30, parseFloat(p[2]) || 3));
      return { titre: p[0] || '', sous: p[1] || '', secs };
    }).filter(s => s.titre || s.sous);
}

/* ---------- texte : découpe en lignes selon la largeur ---------- */
function wrap(text, maxWidth, font){
  ctx.font = font;
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for (const w of words){
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ---------- dessin d'une scène ---------- */
function drawScene(sc, t, pal, idx, total){
  const p = Math.min(1, Math.max(0, t / Math.max(.001, sc.secs)));   // 0 → 1
  // fond
  const g = ctx.createLinearGradient(0, 0, W * .3, H);
  g.addColorStop(0, pal.bg0); g.addColorStop(1, pal.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // halo qui dérive lentement
  const cx = W * (.5 + .18 * Math.sin(t * .7 + idx)), cy = H * (.34 + .06 * Math.cos(t * .5 + idx));
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * .95);
  halo.addColorStop(0, pal.accent + '26'); halo.addColorStop(1, 'transparent');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);

  // titre permanent
  const tfil = $('titreFil').value.trim();
  if (tfil){
    ctx.font = '500 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = pal.dim; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(tfil.toUpperCase(), 90, 90);
  }

  // compteur de scène
  ctx.font = '500 34px ui-monospace, Menlo, monospace';
  ctx.fillStyle = pal.dim; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText(String(idx + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0'), W - 90, 90);

  // entrée : léger glissement + fondu
  const ease = 1 - Math.pow(1 - Math.min(1, t / .55), 3);
  ctx.save();
  ctx.globalAlpha = ease;
  ctx.translate(0, (1 - ease) * 46);

  // titre principal
  const fs = sc.titre.length > 46 ? 76 : sc.titre.length > 28 ? 90 : 112;
  const font = `700 ${fs}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
  const lines = wrap(sc.titre, W - 180, font);
  ctx.font = font; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = pal.ink;
  const lh = fs * 1.12;
  const blockH = lines.length * lh;
  let y = H * .5 - blockH / 2 + fs * .8;
  for (const ln of lines){ ctx.fillText(ln, 90, y); y += lh; }

  // filet d'accent
  ctx.strokeStyle = pal.accent; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(90, y - lh * .2);
  ctx.lineTo(90 + (W - 180) * Math.min(1, p * 1.6), y - lh * .2);
  ctx.stroke();

  // sous-titre
  if (sc.sous){
    ctx.font = '400 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = pal.dim;
    let sy = y + 62;
    for (const ln of wrap(sc.sous, W - 180, ctx.font)){ ctx.fillText(ln, 90, sy); sy += 56; }
  }
  ctx.restore();

  // barre de progression du film
  const totalSecs = scenes.reduce((a, s) => a + s.secs, 0);
  const doneBefore = scenes.slice(0, idx).reduce((a, s) => a + s.secs, 0);
  const prog = Math.min(1, (doneBefore + Math.min(t, sc.secs)) / totalSecs);
  ctx.fillStyle = '#ffffff14'; ctx.fillRect(0, H - 12, W, 12);
  ctx.fillStyle = pal.accent; ctx.fillRect(0, H - 12, W * prog, 12);
}

/* ---------- rendu d'un instant précis ---------- */
function renderAt(ms){
  const pal = PALETTES[$('theme').value] || PALETTES.nuit;
  let acc = 0, i = 0;
  for (; i < scenes.length; i++){
    if (ms < (acc + scenes[i].secs) * 1000) break;
    acc += scenes[i].secs;
  }
  if (i >= scenes.length){ i = scenes.length - 1; acc = scenes.slice(0, i).reduce((a, s) => a + s.secs, 0); }
  const t = ms / 1000 - acc;
  drawScene(scenes[i], Math.max(0, t), pal, i, scenes.length);

  // fondu enchaîné sur les 250 ms qui suivent une frontière
  const rel = t;
  if (i < scenes.length - 1 && rel > scenes[i].secs - .25){
    const a = (rel - (scenes[i].secs - .25)) / .25;
    ctx.save(); ctx.globalAlpha = Math.min(1, a);
    drawScene(scenes[i + 1], 0, pal, i + 1, scenes.length);
    ctx.restore();
  }
}

function totalDuration(){ return scenes.reduce((a, s) => a + s.secs, 0); }

/* ---------- ZIP sans compression (les PNG sont déjà compressés) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(entries){                      // entries: [{name, data:Uint8Array}]
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for (const e of entries){
    const name = enc.encode(e.name);
    const crc = crc32(e.data), size = e.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
    lh.setUint16(8, 0, true);                       // store
    lh.setUint16(10, 0, true); lh.setUint16(12, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, e.data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0, true); cd.setUint16(10, 0, true); cd.setUint16(12, 0, true); cd.setUint16(14, 0, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, size, true); cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true); cd.setUint16(30, 0, true); cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true); cd.setUint16(36, 0, true); cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + size;
  }
  const cdStart = offset;
  let cdSize = 0; for (const c of central) cdSize += c.length;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
  eocd.setUint16(8, entries.length, true); eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true); eocd.setUint32(16, cdStart, true); eocd.setUint16(20, 0, true);
  return new Blob([...chunks, ...central, new Uint8Array(eocd.buffer)], { type: 'application/zip' });
}

/* ---------- export déterministe : une image par pas de temps (JPEG 95) ---------- */
function canvasBlob(canvas, type){
  return new Promise(res => canvas.toBlob(b => res(b), type, type === 'image/jpeg' ? 0.92 : undefined));
}

async function exportFrames(){
  if (recording) return;
  scenes = parseScenes($('scenes').value);
  if (!scenes.length){ setStatus('Aucune scène à générer.', 'err'); return; }
  const fps = parseInt($('fps').value, 10) || 30;
  recording = true; stopFlag = false;
  $('btnFrames').disabled = true; $('btnRender').disabled = true;
  const total = totalDuration();
  const nFrames = Math.max(1, Math.round(total * fps));
  setStatus(`Séquence : ${nFrames} images à ${fps} im/s…`, '');

  const entries = [];
  const t0 = performance.now();
  for (let f = 0; f < nFrames; f++){
    renderAt(Math.min((f * 1000) / fps, total * 1000 - 1));
    const b = await canvasBlob(stage, 'image/jpeg');
    entries.push({ name: `frames/frame_${String(f).padStart(5, '0')}.jpg`,
                   data: new Uint8Array(await b.arrayBuffer()) });
    if (f % 10 === 0) setStatus(`Séquence : image ${f + 1} / ${nFrames}…`, '');
  }
  const zip = zipStore(entries);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zip);
  a.download = `sequence-${fps}fps-${nFrames}img.zip`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  recording = false;
  $('btnFrames').disabled = false; $('btnRender').disabled = false;
  setStatus(`Séquence prête : ${nFrames} images, ${(zip.size / 1048576).toFixed(1)} Mo `
          + `(${((performance.now() - t0) / 1000).toFixed(1)} s). Décompresse et lance sequence-vers-mp4.sh.`, 'ok');
}

/* ---------- choix du format ---------- */
function pickMime(fps){
  const cands = [
    'video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4',
    'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8',
    'video/webm'
  ];
  for (const m of cands) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

/* ---------- export ---------- */
async function render(){
  if (recording) return;
  const txt = $('scenes').value;
  scenes = parseScenes(txt);
  if (!scenes.length){ setStatus('Aucune scène à générer.', 'err'); return; }
  if (!stage.captureStream || !window.MediaRecorder){
    setStatus("Ce navigateur ne sait pas exporter de vidéo (MediaRecorder indisponible). Utilise Chrome, Edge ou Safari récent.", 'err');
    return;
  }

  const fps = parseInt($('fps').value, 10) || 30;
  const mime = pickMime(fps);
  if (!mime){ setStatus("Aucun format vidéo supporté par ce navigateur.", 'err'); return; }

  recording = true; stopFlag = false; chunks = []; lastBlob = null;
  $('btnRender').disabled = true; $('btnStop').disabled = false; $('btnDownload').disabled = true;
  $('mDur').textContent = totalDuration().toFixed(1) + ' s';
  $('mFrames').textContent = Math.round(totalDuration() * fps).toLocaleString('fr-FR');
  $('mMime').textContent = mime.split(';')[0].replace('video/', '').toUpperCase();
  $('mSize').textContent = '—';
  setStatus('Rendu en cours… garde cet onglet actif.', '');

  // captureStream(0) + requestFrame : on pousse exactement une image par pas de temps,
  // donc aucune image sautée ni dupliquée, même si le navigateur limite requestAnimationFrame
  // (onglet en arrière-plan, machine chargée).
  const stream = stage.captureStream(0);
  const track = stream.getVideoTracks()[0];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(res => { recorder.onstop = res; });
  recorder.start(250);

  const total = totalDuration();
  const nFrames = Math.max(1, Math.round(total * fps));
  const step = 1000 / fps;
  const sleep = ms => new Promise(r => setTimeout(r, Math.max(0, ms)));
  const t0 = performance.now();

  for (let f = 0; f < nFrames; f++){
    if (stopFlag) break;
    renderAt(Math.min(f * step, total * 1000 - 1));
    if (track.requestFrame) track.requestFrame();
    const pct = ((f + 1) / nFrames) * 100;
    setStatus(`Rendu… ${pct.toFixed(0)} % — image ${f + 1} / ${nFrames}.`, '');
    // on garde le rythme réel : MediaRecorder horodate en temps réel
    await sleep(t0 + (f + 1) * step - performance.now());
  }
  await sleep(120);

  recorder.stop();
  await done;
  stream.getTracks().forEach(t => t.stop());

  lastBlob = new Blob(chunks, { type: mime.split(';')[0] });
  const mb = lastBlob.size / 1048576;
  $('mSize').textContent = mb.toFixed(2) + ' Mo';
  recording = false;
  $('btnRender').disabled = false; $('btnStop').disabled = true; $('btnDownload').disabled = false;
  window.STUDIO.lastBlob = lastBlob;
  window.STUDIO.lastMime = mime;

  // contrôle : la durée réelle doit coller à la durée voulue
  const real = await blobDuration(lastBlob);
  window.STUDIO.lastDuration = real;
  const ecart = Math.abs(real - total) / total;
  if (ecart > 0.25){
    $('mSize').textContent = mb.toFixed(2) + ' Mo ⚠';
    setStatus(`Attention : fichier de ${real.toFixed(1)} s au lieu de ${total.toFixed(1)} s. `
            + `Le navigateur a bridé le rendu (onglet en arrière-plan ou Mac en veille). `
            + `Relance en gardant la fenêtre visible, ou utilise la séquence d'images.`, 'err');
  } else {
    setStatus(`Vidéo prête : ${mb.toFixed(2)} Mo, ${real.toFixed(1)} s, ${mime.split(';')[0]}.`, 'ok');
  }
}

function download(){
  if (!lastBlob) return;
  const ext = lastBlob.type.includes('mp4') ? 'mp4' : 'webm';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastBlob);
  a.download = `film-9x16-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.${ext}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  setStatus('Fichier envoyé dans les téléchargements.', 'ok');
}

function setStatus(msg, cls){
  const el = $('status'); el.textContent = msg; el.className = cls || '';
}

/* ---------- durée réelle d'un blob vidéo ---------- */
function blobDuration(blob){
  return new Promise(res => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => res(v.duration || 0);
    v.onerror = () => res(0);
    setTimeout(() => res(v.duration || 0), 5000);
    v.src = URL.createObjectURL(blob);
  });
}

/* ---------- amorçage ---------- */
$('scenes').value = DEFAULT_SCENES.map(s => `${s.titre} | ${s.sous} | ${s.secs}`).join('\n');
scenes = DEFAULT_SCENES.slice();
renderAt(400);

$('btnRender').onclick = () => render().catch(e => { setStatus('Erreur : ' + e.message, 'err'); recording = false; $('btnRender').disabled = false; });
$('btnStop').onclick = () => { stopFlag = true; };
$('btnDownload').onclick = download;
$('btnFrames').onclick = () => exportFrames().catch(e => {
  setStatus('Erreur séquence : ' + e.message, 'err'); recording = false;
